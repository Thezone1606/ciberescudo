# Proxy inverso de CiberEscudo: termina TLS 1.3, aplica cabeceras de seguridad y limita peticiones.
# Corre sin root (imagen nginx-unprivileged): escucha en 8080/8443 y compose los publica como 80/443.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  # Rutas temporales en /tmp: el sistema de archivos del contenedor es de solo lectura.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 200k; # la API acepta JSON de hasta 100 kB
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;

  # Límites por IP. El inicio de sesión es el más estricto (fuerza bruta de contraseñas).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream frontend {
    server frontend:3000;
    keepalive 16;
  }
  upstream backend {
    server backend:4000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de seguridad (Semana 17-19). Ningún location define add_header propio, así que todas se heredan.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'unsafe-inline' es necesario por los scripts y estilos en línea de Next.js y de xterm.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    limit_conn perip 40;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se fija a la IP real del cliente (no se acepta la que mande el cliente): evita suplantar la IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By; # no filtrar el framework de las aplicaciones
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Inicio de sesión: 5 intentos por minuto por IP (con una ráfaga corta).
    location = /api/session/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://frontend;
    }
    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend;
    }

    location /api/v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend;
    }
    location /api/session/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://frontend;
    }

    # La documentación de la API no se expone al público.
    location /docs {
      return 404;
    }

    location / {
      limit_req zone=general burst=60 nodelay;
      proxy_pass http://frontend;
    }
  }
}
