# CiberEscudo: despliegue con Docker Compose.
#   cd infra && cp .env.example .env   (completa los secretos)   &&   docker compose up -d --build
#
# Redes aisladas (todas «internal» salvo `edge`, que es la única publicada):
#   edge → nginx │ web → nginx↔frontend │ api → nginx/frontend↔backend │ data → backend↔db
# La base de datos solo es alcanzable desde el backend; el backend y el frontend no tienen salida a internet.
name: ciberescudo

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

networks:
  edge: {}
  web:
    internal: true
  api:
    internal: true
  data:
    internal: true

volumes:
  pgdata: {}

services:
  # Genera un certificado autofirmado la primera vez. En producción coloca el de la CA de la empresa
  # en infra/certs (fullchain.pem y privkey.pem): si ya existen, este paso no hace nada.
  certs:
    image: alpine/openssl:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -s /certs/fullchain.pem ] && [ -s /certs/privkey.pem ]; then
          echo "Certificados existentes: no se genera ninguno."
        else
          openssl req -x509 -newkey rsa:3072 -nodes -days 365 \
            -keyout /certs/privkey.pem -out /certs/fullchain.pem \
            -subj "/CN=$${SERVER_NAME}" \
            -addext "subjectAltName=DNS:$${SERVER_NAME},DNS:localhost,IP:127.0.0.1"
          chmod 0644 /certs/fullchain.pem /certs/privkey.pem
          echo "Certificado autofirmado generado para $${SERVER_NAME}."
        fi
    environment:
      SERVER_NAME: ${SERVER_NAME:?define SERVER_NAME en infra/.env}
    volumes:
      - ./certs:/certs

  db:
    <<: *hardening
    image: postgres:16-alpine
    # El arranque de Postgres necesita estas capacidades para ajustar permisos del volumen.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsi_cyber}
      POSTGRES_USER: ${POSTGRES_USER:-dsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    build:
      context: ../backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-dsi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dsi_cyber}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en infra/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en infra/.env}
      CORS_ORIGIN: https://${SERVER_NAME}
      TRUST_PROXY: "true"
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    read_only: true
    tmpfs: ["/tmp"]
    networks: [api, data]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *hardening
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:4000
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      COOKIE_SECURE: "true"
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    networks: [api, web]
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs: ["/tmp"]
    networks: [edge, web, api]
    depends_on:
      certs:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
